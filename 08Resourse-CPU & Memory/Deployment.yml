apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        ports:
        - containerPort: 80

        volumeMounts:
        - name: my-storage
          mountPath: "/usr/share/nginx/html"

      volumes:
      - name: my-storage
        persistentVolumeClaim:
          claimName: local-pvc